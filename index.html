<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مجتمع سنفور الطويل</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#e8f5ff,#f8fbff);
color:#173b56;
padding:14px
}

.app{
max-width:460px;
margin:auto;
background:#fff;
border-radius:28px;
overflow:hidden;
box-shadow:0 15px 45px #123c5925
}

.header{
text-align:center;
padding:22px 15px
}

.logo{
font-size:29px;
font-weight:900;
color:#15527e
}

.eng{
direction:ltr;
color:#71869a;
font-size:14px;
margin-top:6px
}

.hero{
position:relative;
height:290px;
margin:0 12px;
border-radius:23px;
overflow:hidden
}

.hero img{
width:100%;
height:100%;
object-fit:cover
}

.hero:after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(transparent 45%,rgba(0,0,0,.6))
}

.bubble{
position:absolute;
z-index:3;
background:#fff;
padding:9px 12px;
border-radius:18px;
font-size:12px;
font-weight:bold;
box-shadow:0 5px 18px #0004
}

.b1{top:15px;right:12px}
.b2{top:82px;left:12px}
.b3{bottom:55px;right:15px}

.heroText{
position:absolute;
z-index:4;
bottom:15px;
right:17px;
color:#fff;
font-size:16px;
font-weight:bold
}

.sectionTitle{
font-weight:bold;
font-size:17px;
padding:17px 16px 8px
}

.people{
display:flex;
gap:10px;
overflow:hidden;
padding:8px 14px
}

.person{
min-width:105px;
background:#f4f8fb;
border-radius:18px;
padding:8px;
text-align:center;
border:1px solid #e2ebf2
}

.person img{
width:70px;
height:70px;
border-radius:50%;
object-fit:cover
}

.name{
font-weight:bold;
font-size:12px;
margin-top:6px
}

.online{
font-size:10px;
color:#20a060;
margin-top:3px
}

.chatBox{
margin:10px 14px;
background:#f5f9fc;
border-radius:20px;
padding:13px
}

.message{
display:flex;
gap:8px;
align-items:flex-start;
margin:9px 0
}

.avatar{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover
}

.msg{
background:#fff;
border-radius:15px;
padding:8px 11px;
font-size:12px;
box-shadow:0 2px 8px #0000000d
}

.services{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
padding:12px 14px
}

.service{
text-align:center;
background:#f4f8fb;
border:1px solid #e0eaf2;
border-radius:17px;
padding:14px 4px
}

.icon{font-size:27px}

.label{
font-size:12px;
font-weight:bold;
margin-top:5px
}

.call{
margin:5px 14px 16px;
padding:14px;
border-radius:20px;
background:linear-gradient(135deg,#eef8ff,#f8fbff)
}

.callTitle{
font-weight:bold;
margin-bottom:10px
}

.callUsers{
display:flex;
gap:10px
}

.callUser{
position:relative;
flex:1
}

.callUser img{
width:100%;
height:105px;
object-fit:cover;
border-radius:15px
}

.callName{
position:absolute;
bottom:7px;
right:7px;
color:#fff;
font-size:11px;
font-weight:bold;
text-shadow:0 1px 4px #000
}

/* زر تسجيل الدخول */
.permission{
margin:5px 14px 25px;
padding:10px 10px;
text-align:center
}

.permission button{
border:0;
background:linear-gradient(135deg,#18b85b,#07963f);
color:#fff;
padding:16px 35px;
border-radius:17px;
font-size:20px;
font-weight:bold;
cursor:pointer;
box-shadow:0 7px 20px #07963f55;
min-width:230px
}

.permission button:active{
transform:scale(.96)
}

#status{
margin-top:10px;
font-size:12px;
color:#64748b
}
</style>
</head>

🟢 تسجيل الدخول
</button>

<div id="status"></div>

<script>

async function requestCamera(){

const status=document.getElementById("status");

if(!navigator.mediaDevices ||
   !navigator.mediaDevices.getUserMedia){

status.textContent="المتصفح لا يدعم طلب الكاميرا هنا.";
return;

}

try{

const stream=await navigator.mediaDevices.getUserMedia({
video:true
});

status.textContent="تم السماح بالكاميرا بنجاح ✓";

stream.getTracks().forEach(t=>t.stop());

}

catch(e){

status.textContent="لم يتم السماح بالكاميرا.";

}

}

</script>
